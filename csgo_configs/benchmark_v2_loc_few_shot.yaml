schema_version: 1

# Optional. Set this single value to use the portable flat Benchmark v2 bundle.
# null preserves the historical data/preprocessed_data backend.
benchmark_v2_asset_manifest: null

protocol:
  manifest: data/csgo_benchmark_v2/benchmark_manifest.json
  support_seed: 0
  prerequisite_shots_per_map: 100
  shots_per_map: [50, 20, 10]
  max_steps: 400
  inference_seed: 42
  crossmap_maps: [cs_office, de_golden, de_palacio, de_vertigo]
  seen_maps:
    - cs_agency
    - cs_italy
    - de_ancient
    - de_anubis
    - de_dust2
    - de_inferno
    - de_mirage
    - de_nuke
    - de_overpass
    - de_train
  expected_samples:
    crossmap_query_test: 8000
    seen_discrete_test: 20000

paths:
  model_root: outputs/csgo_1b
  localization_root: outputs_loc/benchmark_v2
  log_root: logs/benchmark_v2_loc_few_shot

scheduling:
  cuda_device: "0"
  max_parallel_pipelines: 6
  minimum_free_memory_mb: 26000
  launch_settle_seconds: 180
  poll_seconds: 60
  prerequisite_timeout_seconds: 21600
  prerequisite_summary_settle_seconds: 10
  stop_launching_on_failure: True

training:
  # The task-homogeneous sampler emits only complete batches. Keep the 128-row
  # cap where possible, but ensure 20/10-shot datasets still yield one batch.
  train_batch_size_by_shot:
    50: 128
    20: 80
    10: 40
  common_args:
    deepspeed: deepspeed_scripts/zero0.json
    model_name_or_path: UniLIP-1B
    unilip_factor: 10.6
    mllm_hf_path: OpenGVLab/InternVL3-1B-hf
    version: internvl
    data_type: mix
    csgo_image_folder: data/preprocessed_data
    mm_use_im_start_end: False
    mm_use_im_patch_token: False
    bf16: True
    num_train_epochs: 10
    per_device_eval_batch_size: 128
    gradient_accumulation_steps: 1
    eval_strategy: "no"
    save_strategy: steps
    learning_rate: 1.0e-4
    weight_decay: 0.0
    warmup_ratio: 0.003
    lr_scheduler_type: cosine_with_min_lr
    model_max_length: 1024
    logging_steps: 1
    tf32: True
    gradient_checkpointing: True
    dataloader_num_workers: 4
    lazy_preprocess: True
    n_query: 256
    n_und_query: 0
    report_to: wandb

experiments:
  exp33_loc:
    train_config: csgo_configs/exp33_loc.yaml
    eval_config: csgo_configs/test/exp33_loc_loc.yaml
    parent_checkpoint: outputs/csgo_1b/exp31_loc/model.safetensors
    master_ports:
      50: 29650
      20: 29620
      10: 29610
    train_args:
      save_steps: 4000
      save_total_limit: 4
      fix_dit: True
      fix_connect: True
      fix_llm: True

  exp34_loc:
    train_config: csgo_configs/exp34_loc.yaml
    eval_config: csgo_configs/test/exp34_loc_loc.yaml
    parent_checkpoint: outputs/csgo_1b/exp32_loc/model.safetensors
    master_ports:
      50: 29750
      20: 29720
      10: 29710
    train_args:
      save_steps: 2000
      save_total_limit: 4
      fix_dit: True
      fix_connect: True
      fix_llm: False
      lora_r: 32
      lora_alpha: 64
